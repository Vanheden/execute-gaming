<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="duoSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#180410"/>
      <stop offset="0.55" stop-color="#280611"/>
      <stop offset="1" stop-color="#3a0a16"/>
    </linearGradient>
    <radialGradient id="duoMoon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a9a"/>
      <stop offset="0.5" stop-color="#ff3d57"/>
      <stop offset="1" stop-color="#ff3d57" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3f6"/>
      <stop offset="1" stop-color="#9fb0ba"/>
    </linearGradient>
    <g id="batDuo">
      <path d="M24 6 C21 1 15 3 14 8 C12 3 6 2 3 6 C8 5 8 11 5 13 C10 11 13 11 14 15 C16 10 19 10 24 12 C29 10 32 10 34 15 C35 11 38 11 43 13 C40 11 40 5 45 6 C42 2 36 3 34 8 C33 3 27 1 24 6 Z"/>
    </g>
    <g id="sword">
      <path d="M0 -96 L6 -80 L5 16 L-5 16 L-6 -80 Z" fill="url(#blade)"/>
      <rect x="-22" y="14" width="44" height="8" rx="3" fill="#ff5db1"/>
      <rect x="-5" y="22" width="10" height="26" rx="2" fill="#5a1020"/>
      <circle cx="0" cy="52" r="7" fill="#ff5db1"/>
    </g>
  </defs>

  <rect width="640" height="360" fill="url(#duoSky)"/>

  <!-- blood moon -->
  <circle cx="320" cy="120" r="150" fill="url(#duoMoon)" opacity="0.6"/>
  <circle cx="320" cy="120" r="66" fill="#ff5566"/>
  <circle cx="345" cy="102" r="10" fill="#d83a4c" opacity="0.6"/>
  <circle cx="300" cy="140" r="8" fill="#d83a4c" opacity="0.5"/>

  <!-- stars -->
  <g fill="#ff9aa6">
    <circle cx="80" cy="60" r="1.5"/><circle cx="180" cy="40" r="1.1"/>
    <circle cx="520" cy="55" r="1.4"/><circle cx="600" cy="120" r="1.1"/>
  </g>

  <!-- bats -->
  <g fill="#12030a">
    <use href="#batDuo" transform="translate(120 80) scale(1.4)"/>
    <use href="#batDuo" transform="translate(470 70) scale(1.0)"/>
    <use href="#batDuo" transform="translate(540 140) scale(0.7)"/>
    <use href="#batDuo" transform="translate(210 60) scale(0.6)"/>
  </g>

  <!-- castle silhouette -->
  <g fill="#0c0207">
    <rect x="0" y="300" width="170" height="60"/>
    <rect x="14" y="292" width="14" height="10"/><rect x="46" y="292" width="14" height="10"/>
    <rect x="78" y="292" width="14" height="10"/><rect x="110" y="292" width="14" height="10"/>
    <rect x="90" y="236" width="44" height="124"/>
    <path d="M86 236 L112 198 L138 236 Z"/>
    <rect x="500" y="244" width="46" height="116"/>
    <path d="M496 244 L523 204 L550 244 Z"/>
    <rect x="470" y="300" width="170" height="60"/>
    <rect x="516" y="292" width="14" height="10"/><rect x="548" y="292" width="14" height="10"/>
    <rect x="580" y="292" width="14" height="10"/><rect x="612" y="292" width="14" height="10"/>
  </g>

  <!-- lit windows -->
  <g fill="#ff6b57">
    <rect x="106" y="262" width="9" height="15" rx="2"/>
    <rect x="516" y="270" width="9" height="15" rx="2"/>
  </g>

  <!-- crossed swords -->
  <g transform="translate(320 250)">
    <use href="#sword" transform="rotate(32)"/>
    <use href="#sword" transform="rotate(-32)"/>
  </g>

  <!-- fog -->
  <rect y="322" width="640" height="38" fill="#3a0a16" opacity="0.6"/>
</svg>

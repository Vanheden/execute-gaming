<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Execute-Gaming">
  <defs>
    <linearGradient id="eg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cff"/>
      <stop offset="0.5" stop-color="#ff5db1"/>
      <stop offset="1" stop-color="#ff9f45"/>
    </linearGradient>
  </defs>
  <!-- hexagon badge -->
  <path d="M44 24 L34 41.32 L14 41.32 L4 24 L14 6.68 L34 6.68 Z"
